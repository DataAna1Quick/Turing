<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title id="page-title">CIRO — Presentación a Gerencia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0e1822;
        --bg-alt: #0a1118;
        --bg-gradient: radial-gradient(
          120% 120% at 80% -10%,
          #13202b 0%,
          var(--bg) 45%,
          var(--bg-alt) 100%
        );
        --panel: #16242f;
        --panel-alt: #1b2d3a;
        --line: rgba(143, 163, 176, 0.16);
        --line-strong: rgba(143, 163, 176, 0.3);
        --text: #eaf1f4;
        --text-dim: #a7bbc7;
        --text-muted: #7c93a1;
        /* ⭐ Acento principal = amarillo Quick */
        --accent: #fdd402;
        --accent-alt: #57d0e0;
        --ok: #5fd08c;
        --error: #f2685c;
        --pending: var(--accent);
        --font-display: "Space Grotesk", sans-serif;
        --font-body: "IBM Plex Sans", sans-serif;
        --font-mono: "IBM Plex Mono", monospace;
        --radius-card: 14px;
        --radius-sm: 10px;
        --radius-tag: 999px;
        --glow-accent: drop-shadow(0 8px 40px rgba(253, 212, 2, 0.18));
        --chrome-h: 56px;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        background: var(--bg-gradient);
        color: var(--text);
        font-family: var(--font-body);
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      .deck {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .chrome {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 40;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 30px;
        height: var(--chrome-h);
        font-family: var(--font-mono);
        font-size: 11px;
        letter-spacing: 0.14em;
        color: var(--text-muted);
        text-transform: uppercase;
      }
      .chrome-brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .chrome-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 14%, transparent);
      }
      .chrome-count b {
        color: var(--text);
        font-weight: 600;
      }
      .progress {
        position: fixed;
        top: 0;
        left: 0;
        height: 3px;
        z-index: 50;
        background: linear-gradient(90deg, var(--accent-alt), var(--accent));
        width: 0;
        transition: width 0.45s cubic-bezier(0.6, 0.1, 0.2, 1);
      }
      .slide {
        position: absolute;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        padding: calc(var(--chrome-h) + 40px) 7vw 92px;
      }
      .slide.active {
        display: flex;
      }
      .pane {
        width: 100%;
        max-width: 1120px;
        opacity: 0;
        transform: translateY(14px);
      }
      .slide.active .pane {
        animation: rise 0.6s cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
      }
      @keyframes rise {
        to {
          opacity: 1;
          transform: none;
        }
      }
      .stagger > * {
        opacity: 0;
        transform: translateY(12px);
        animation: rise 0.55s cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
      }
      .slide.active .stagger > *:nth-child(1) {
        animation-delay: 0.05s;
      }
      .slide.active .stagger > *:nth-child(2) {
        animation-delay: 0.13s;
      }
      .slide.active .stagger > *:nth-child(3) {
        animation-delay: 0.21s;
      }
      .slide.active .stagger > *:nth-child(4) {
        animation-delay: 0.29s;
      }
      .slide.active .stagger > *:nth-child(5) {
        animation-delay: 0.37s;
      }
      .slide.active .stagger > *:nth-child(6) {
        animation-delay: 0.45s;
      }
      .slide.active .stagger > *:nth-child(7) {
        animation-delay: 0.53s;
      }
      .slide.active .stagger > *:nth-child(8) {
        animation-delay: 0.61s;
      }
      .slide.active .stagger > *:nth-child(9) {
        animation-delay: 0.69s;
      }
      .slide.active .stagger > *:nth-child(10) {
        animation-delay: 0.77s;
      }
      .eyebrow {
        font-family: var(--font-mono);
        font-size: 12px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--accent-alt);
        margin-bottom: 18px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .eyebrow .ln {
        height: 1px;
        width: 48px;
        background: var(--line-strong);
      }
      h1 {
        font-family: var(--font-display);
        font-weight: 600;
        letter-spacing: -0.01em;
        line-height: 1.04;
      }
      h2 {
        font-family: var(--font-display);
        font-weight: 600;
        font-size: clamp(28px, 3.6vw, 46px);
        letter-spacing: -0.01em;
        line-height: 1.05;
        margin-bottom: 8px;
      }
      .lede {
        color: var(--text-dim);
        font-size: clamp(15px, 1.5vw, 18px);
        line-height: 1.55;
        max-width: 62ch;
      }
      .mono {
        font-family: var(--font-mono);
      }
      .grid-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      .grid-3 {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 12px;
      }
      .grid-4 {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 14px;
      }
      .span-full {
        grid-column: 1 / -1;
      }
      .card {
        background: linear-gradient(
          180deg,
          var(--panel) 0%,
          var(--panel-alt) 100%
        );
        border: 1px solid var(--line);
        border-radius: var(--radius-card);
        padding: 20px 22px;
      }
      .card h3 {
        font-family: var(--font-display);
        font-weight: 600;
        font-size: 17px;
        margin-bottom: 7px;
        letter-spacing: -0.01em;
      }
      .card p {
        color: var(--text-dim);
        font-size: 13.5px;
        line-height: 1.5;
      }
      .card-accent {
        border-color: color-mix(in srgb, var(--accent) 20%, transparent);
      }
      .card-ok {
        border-color: color-mix(in srgb, var(--ok) 25%, transparent);
      }
      .card-error {
        border-color: color-mix(in srgb, var(--error) 20%, transparent);
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 14px;
        margin-top: 30px;
      }
      .stat {
        border: 1px solid var(--line);
        border-radius: var(--radius-card);
        padding: 20px;
        background: rgba(255, 255, 255, 0.015);
      }
      .stat-n {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: clamp(30px, 4vw, 48px);
        letter-spacing: -0.02em;
        line-height: 1;
      }
      .stat-n.stat-accent {
        color: var(--accent);
      }
      .stat-n.stat-alt {
        color: var(--accent-alt);
      }
      .stat-l {
        font-size: 12.5px;
        color: var(--text-muted);
        margin-top: 9px;
        line-height: 1.4;
      }
      .tag {
        font-family: var(--font-mono);
        font-size: 11.5px;
        letter-spacing: 0.08em;
        color: var(--text-dim);
        border: 1px solid var(--line-strong);
        border-radius: var(--radius-tag);
        padding: 7px 13px;
        background: rgba(255, 255, 255, 0.02);
      }
      .compare {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        gap: 22px;
        align-items: stretch;
        margin-top: 8px;
      }
      .compare-arrow {
        align-self: center;
        font-family: var(--font-display);
        font-size: 34px;
        color: var(--accent);
      }
      .col-head {
        font-family: var(--font-mono);
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        margin-bottom: 12px;
      }
      .col-head-before {
        color: var(--error);
      }
      .col-head-after {
        color: var(--ok);
      }
      .col ul {
        list-style: none;
        display: grid;
        gap: 10px;
      }
      .col li {
        font-size: 14px;
        color: var(--text-dim);
        line-height: 1.45;
        padding-left: 20px;
        position: relative;
      }
      .col li::before {
        content: "";
        position: absolute;
        left: 0;
        top: 8px;
        width: 7px;
        height: 7px;
        border-radius: 50%;
      }
      .col-before li::before {
        background: var(--error);
      }
      .col-after li::before {
        background: var(--ok);
      }
      .scope-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-top: 22px;
      }
      .scope-col {
        display: grid;
        gap: 10px;
      }
      .scope-item {
        padding: 14px 18px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: linear-gradient(180deg, var(--panel), var(--panel-alt));
        font-size: 13.5px;
        color: var(--text-dim);
        line-height: 1.45;
        display: flex;
        align-items: flex-start;
        gap: 10px;
      }
      .scope-item .icon {
        flex-shrink: 0;
        font-size: 16px;
        margin-top: 1px;
      }
      .scope-do {
        border-color: color-mix(in srgb, var(--ok) 25%, transparent);
      }
      .scope-dont {
        border-color: color-mix(in srgb, var(--error) 20%, transparent);
      }
      .scope-head-do {
        color: var(--ok);
        margin-bottom: 2px;
      }
      .scope-head-dont {
        color: var(--error);
        margin-bottom: 2px;
      }
      .roles {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        margin-top: 24px;
      }
      .role-card {
        border: 1px solid var(--line);
        border-radius: var(--radius-card);
        padding: 20px 22px;
        background: linear-gradient(180deg, var(--panel), var(--panel-alt));
      }
      .role-card .ico {
        font-size: 24px;
        margin-bottom: 6px;
      }
      .role-card .nm {
        font-family: var(--font-display);
        font-weight: 600;
        font-size: 17px;
        margin-bottom: 2px;
      }
      .role-card .rl {
        font-family: var(--font-mono);
        font-size: 10.5px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--accent-alt);
        margin-bottom: 8px;
      }
      .role-card p {
        font-size: 13px;
        color: var(--text-dim);
        line-height: 1.5;
      }
      .role-card.key {
        border-color: color-mix(in srgb, var(--accent) 30%, transparent);
      }
      .role-card.key .rl {
        color: var(--accent);
      }
      .role-card.centered {
        grid-column: 1 / -1;
        max-width: 520px;
        justify-self: center;
      }
      .risk-intro {
        font-size: 13.5px;
        color: var(--text-dim);
        line-height: 1.5;
        margin-top: 4px;
        margin-bottom: 18px;
      }
      .risk-grid {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 12px;
        margin-top: 12px;
      }
      .risk-card {
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 16px;
        background: linear-gradient(180deg, var(--panel), var(--panel-alt));
      }
      .risk-card .rtag {
        font-family: var(--font-mono);
        font-size: 9.5px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        margin-bottom: 6px;
      }
      .rtag-alto {
        color: var(--error);
      }
      .rtag-medio {
        color: var(--accent);
      }
      .risk-card h4 {
        font-family: var(--font-display);
        font-weight: 600;
        font-size: 15px;
        margin-bottom: 4px;
      }
      .risk-card .rdesc {
        font-size: 12px;
        color: var(--text-dim);
        line-height: 1.4;
      }
      .risk-card .rmit {
        font-size: 12px;
        color: var(--text-dim);
        line-height: 1.45;
        margin-top: 6px;
        padding-left: 14px;
        position: relative;
      }
      .risk-card .rmit::before {
        content: "";
        position: absolute;
        left: 0;
        top: 6px;
        width: 5px;
        height: 5px;
        border-radius: 50%;
      }
      .rmit-mit::before {
        background: var(--ok);
      }
      .rmit-con::before {
        background: var(--accent);
      }
      .rmit-pen {
        color: var(--accent);
        font-style: italic;
      }
      .rmit-pen::before {
        background: var(--accent);
      }
      .risk-bar {
        font-size: 12px;
        padding: 12px 16px;
        border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent);
        border-radius: var(--radius-sm);
        background: color-mix(in srgb, var(--accent) 4%, transparent);
        color: var(--text-dim);
        line-height: 1.5;
        margin-top: 22px;
      }
      .milestones {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 18px;
        margin-top: 26px;
      }
      .milestone {
        text-align: center;
        border: 1px solid var(--line);
        border-radius: var(--radius-card);
        padding: 24px 18px;
        background: linear-gradient(180deg, var(--panel), var(--panel-alt));
      }
      .milestone .day {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 42px;
        letter-spacing: -0.03em;
        line-height: 1;
      }
      .milestone .lbl {
        font-family: var(--font-mono);
        font-size: 11px;
        letter-spacing: 0.1em;
        color: var(--text-muted);
        margin-top: 4px;
      }
      .milestone p {
        font-size: 13px;
        color: var(--text-dim);
        line-height: 1.45;
        margin-top: 14px;
      }
      .milestone-accent {
        border-color: var(--accent);
      }
      .milestone-alt {
        border-color: var(--accent-alt);
      }
      .milestone-ok {
        border-color: var(--ok);
      }
      .milestone-accent .day {
        color: var(--accent);
      }
      .milestone-alt .day {
        color: var(--accent-alt);
      }
      .milestone-ok .day {
        color: var(--ok);
      }
      .go-box {
        margin-top: 20px;
        padding: 16px 20px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: color-mix(in srgb, var(--accent-alt) 4%, transparent);
      }
      .go-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px 24px;
        font-size: 12.5px;
        color: var(--text-dim);
      }
      .go-foot {
        margin-top: 10px;
        font-size: 11.5px;
        color: var(--text-muted);
        font-family: var(--font-mono);
      }
      .next-steps {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 16px;
      }
      .next-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 18px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: linear-gradient(180deg, var(--panel), var(--panel-alt));
      }
      .next-item .who {
        font-family: var(--font-mono);
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
      }
      .next-item .what {
        font-size: 13px;
        color: var(--text-dim);
        line-height: 1.4;
      }
      .warning-box {
        margin-top: 12px;
        padding: 12px 18px;
        border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
        border-radius: var(--radius-sm);
        background: color-mix(in srgb, var(--accent) 4%, transparent);
      }
      .warning-box .text {
        font-size: 12.5px;
        color: var(--text-dim);
        line-height: 1.5;
      }
      .cover {
        position: relative;
      }
      .cover h1 {
        font-size: clamp(72px, 15vw, 168px);
        letter-spacing: -0.04em;
      }
      .cover-quote {
        position: absolute;
        right: 0;
        top: 50%;
        transform: translateY(-50%);
        max-width: 320px;
        padding-left: 22px;
        border-left: 3px solid var(--accent);
        font-family: var(--font-body);
        font-weight: 300;
        font-size: clamp(15px, 1.4vw, 19px);
        line-height: 1.5;
        color: var(--text-dim);
      }
      @media (max-width: 980px) {
        .cover-quote {
          position: static;
          transform: none;
          max-width: 100%;
          margin-top: 28px;
        }
      }
      .cover .glyph {
        font-family: var(--font-display);
        font-weight: 700;
        background: linear-gradient(
          120deg,
          #ffe680 0%,
          var(--accent) 40%,
          #e8b400 100%
        );
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter: var(--glow-accent);
      }
      .cover-sub {
        font-family: var(--font-display);
        font-weight: 500;
        font-size: clamp(19px, 2.4vw, 30px);
        color: var(--text);
        margin-top: 6px;
        letter-spacing: -0.01em;
      }
      .cover-sub-dim {
        font-family: var(--font-body);
        font-size: clamp(14px, 1.3vw, 18px);
        color: var(--text-dim);
        margin-top: 12px;
      }
      .cover-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 34px;
      }
      .closing {
        text-align: center;
      }
      .closing .big {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: clamp(56px, 10vw, 120px);
        letter-spacing: -0.04em;
        background: linear-gradient(
          120deg,
          #ffe680 0%,
          var(--accent) 40%,
          #e8b400 100%
        );
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter: var(--glow-accent);
        margin-bottom: 14px;
      }
      .hint {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 40;
        font-family: var(--font-mono);
        font-size: 10.5px;
        letter-spacing: 0.12em;
        color: var(--text-muted);
        text-transform: uppercase;
        display: flex;
        gap: 18px;
        align-items: center;
      }
      .hint kbd {
        border: 1px solid var(--line-strong);
        border-radius: 5px;
        padding: 2px 7px;
        color: var(--text-dim);
        font-size: 10px;
      }
      .nav-arrows {
        position: fixed;
        bottom: 16px;
        right: 24px;
        z-index: 41;
        display: flex;
        gap: 8px;
      }
      .nav-arrows button {
        width: 38px;
        height: 38px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--line-strong);
        background: rgba(255, 255, 255, 0.03);
        color: var(--text-dim);
        font-size: 17px;
        cursor: pointer;
        transition: 0.18s;
      }
      .nav-arrows button:hover {
        background: color-mix(in srgb, var(--accent) 12%, transparent);
        color: var(--accent);
        border-color: color-mix(in srgb, var(--accent) 40%, transparent);
      }
      @media (max-width: 880px) {
        .slide {
          padding: calc(var(--chrome-h) + 30px) 6vw 96px;
        }
        .grid-2,
        .grid-3,
        .grid-4,
        .stats,
        .scope-grid,
        .roles,
        .milestones,
        .next-steps,
        .risk-grid {
          grid-template-columns: 1fr;
        }
        .compare {
          grid-template-columns: 1fr;
        }
        .compare-arrow {
          transform: rotate(90deg);
        }
        .go-grid {
          grid-template-columns: 1fr;
        }
        .hint {
          display: none;
        }
      }
      @media (max-width: 600px) {
        .chrome {
          padding: 0 16px;
          font-size: 10px;
        }
        .chrome-brand .chrome-label {
          display: none;
        }
        .nav-arrows {
          bottom: 12px;
          right: 12px;
        }
        .nav-arrows button {
          width: 34px;
          height: 34px;
          font-size: 15px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
        .pane,
        .stagger > * {
          opacity: 1;
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="progress" id="progress"></div>
    <header class="chrome" id="chrome">
      <div class="chrome-brand">
        <span class="chrome-dot"></span>
        <span class="chrome-label"></span>
      </div>
      <div class="chrome-tagline"></div>
      <div class="chrome-count mono">
        <b id="cur">01</b> / <span id="tot">00</span>

        function renderCards(cards) {

        const slideEls = [...document.querySelectorAll(".slide")];

            s.classList.toggle("active", k === current),
          );
          prog.style.width = ((current + 1) / total) * 100 + "%";

          show(current + 1);

        function prev() {
          show(current - 1);

          function (e) {
            touchX = e.touches[0].clientX;
          },
          { passive: true },
        );
        document.addEventListener(
          "touchend",
          function (e) {
            const dx = e.changedTouches[0].clientX - touchX;
            if (Math.abs(dx) > 50) {
              dx < 0 ? next() : prev();
            }
          },
          { passive: true },
        );
        show(0);
      })();
    </script>
